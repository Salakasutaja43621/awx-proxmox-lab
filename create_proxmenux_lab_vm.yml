---
# AWX playbook: create an ordinary, disposable Ubuntu test VM on your existing
# Proxmox VE host. It leaves the new VM powered off for review; start it and
# install Ubuntu using the VM console when you are ready.
# No third-party Ansible collection is required; this uses ansible.builtin.uri.
#
# AWX setup:
#   1. Put this file in a Git repository and add that repository as an AWX Project.
#   2. Create a custom Credential Type with Input Configuration:
#        fields:
#          - id: token_id
#            type: string
#            label: Proxmox API token ID
#          - id: token_secret
#            type: string
#            label: Proxmox API token secret
#            secret: true
#        required: [token_id, token_secret]
#      Injector Configuration:
#        env:
#          PVE_TOKEN_ID: '{{ token_id }}'
#          PVE_TOKEN_SECRET: '{{ token_secret }}'
#   3. Create a Credential of that type and attach it to an AWX Job Template.
#      Select an inventory containing localhost and this playbook in the Project.
#   4. Supply the required extra variables listed below through the Job Template
#      or a Survey. Do not put token values in Git or survey extra variables.
#
# Required extra variables (example values only):
#   pve_api_host: 10.128.0.10       # Proxmox VE host IP or DNS name
#   pve_node: pve                  # Exact node name shown by Proxmox
#   vm_id: 310                     # Unused numeric VM ID
#   vm_name: awx-created-test
#   vm_disk_storage: local-lvm     # Storage that permits VM disks
#   vm_iso: local:iso/ubuntu-24.04.3-live-server-amd64.iso
#           # Use the exact volume ID of the ISO you actually uploaded
# Optional: vm_bridge (vmbr0), vm_memory_mb (2048), vm_cores (2),
#           vm_disk_gb (25), pve_validate_certs (true).
# The AWX execution environment must reach https://pve_api_host:8006.

- name: Create a disposable VM on Proxmox VE
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    vm_bridge: vmbr0
    vm_memory_mb: 2048
    vm_cores: 2
    vm_disk_gb: 25
    pve_validate_certs: true
    pve_api: "https://{{ pve_api_host }}:8006/api2/json"
    pve_headers:
      Authorization: "PVEAPIToken={{ lookup('ansible.builtin.env', 'PVE_TOKEN_ID') }}={{ lookup('ansible.builtin.env', 'PVE_TOKEN_SECRET') }}"

  tasks:
    - name: Verify required configuration and credentials
      ansible.builtin.assert:
        that:
          - pve_api_host is defined
          - pve_node is defined
          - vm_name is defined
          - vm_disk_storage is defined
          - vm_iso is defined
          - lookup('ansible.builtin.env', 'PVE_TOKEN_ID') | length > 0
          - lookup('ansible.builtin.env', 'PVE_TOKEN_SECRET') | length > 0
        fail_msg: "Set the required VM variables and attach the Proxmox API token credential."

    - name: List existing VMs on the selected node
      ansible.builtin.uri:
        url: "{{ pve_api }}/nodes/{{ pve_node }}/qemu"
        method: GET
        headers: "{{ pve_headers }}"
        validate_certs: "{{ pve_validate_certs }}"
        status_code: 200
      register: vm_list

    - name: Find an existing VM with the requested name
      ansible.builtin.set_fact:
        matching_vms: >-
          {{
            vm_list.json.data
            | selectattr('name', 'defined')
            | selectattr('name', 'equalto', vm_name)
            | list
          }}

    - name: Refuse ambiguous VM names
      ansible.builtin.assert:
        that:
          - matching_vms | length <= 1
        fail_msg: "Multiple VMs named {{ vm_name }} exist on {{ pve_node }}."

    - name: Determine whether creation is needed
      ansible.builtin.set_fact:
        needs_creation: "{{ matching_vms | length == 0 }}"

    - name: Get the next available VM ID
      ansible.builtin.uri:
        url: "{{ pve_api }}/cluster/nextid"
        method: GET
        headers: "{{ pve_headers }}"
        validate_certs: "{{ pve_validate_certs }}"
        status_code: 200
      register: next_id
      when: needs_creation | bool

    - name: Set the VM ID for subsequent tasks
      ansible.builtin.set_fact:
        selected_vm_id: >-
          {{
            (next_id.json.data | int)
            if (needs_creation | bool)
            else (matching_vms[0].vmid | int)
          }}

    - name: Create the VM, attached Ubuntu installer ISO, and disk
      ansible.builtin.uri:
        url: "{{ pve_api }}/nodes/{{ pve_node }}/qemu"
        method: POST
        headers: "{{ pve_headers }}"
        body_format: form-urlencoded
        body:
          start: 1
          vmid: "{{ selected_vm_id }}"
          name: "{{ vm_name }}"
          ostype: l26
          sockets: 1
          cores: "{{ vm_cores }}"
          memory: "{{ vm_memory_mb }}"
          scsihw: virtio-scsi-single
          scsi0: "{{ vm_disk_storage }}:{{ vm_disk_gb }}"
          ide2: "{{ vm_iso }},media=cdrom"
          net0: "virtio,bridge={{ vm_bridge }}"
          boot: "order=ide2;scsi0"
        validate_certs: "{{ pve_validate_certs }}"
        status_code: 200
      register: create_vm
      changed_when: true
      when: needs_creation | bool

    - name: Wait for the Proxmox VM creation task to finish
      ansible.builtin.uri:
        url: "{{ pve_api }}/nodes/{{ pve_node }}/tasks/{{ create_vm.json.data | urlencode }}/status"
        method: GET
        headers: "{{ pve_headers }}"
        validate_certs: "{{ pve_validate_certs }}"
        status_code: 200
      register: create_status
      until: create_status.json.data.status == 'stopped'
      retries: 60
      delay: 5
      when: needs_creation | bool

    - name: Confirm that Proxmox created the VM successfully
      ansible.builtin.assert:
        that:
          - create_status.json.data.exitstatus == 'OK'
        fail_msg: "Proxmox reported that the VM creation task failed; inspect Tasks on node {{ pve_node }}."
      when: needs_creation | bool


    - name: Finish unattended installation for the newly created VM
      when: needs_creation | bool
      block:
        - name: Wait for the Debian installer to power off the VM
          ansible.builtin.uri:
            url: "{{ pve_api }}/nodes/{{ pve_node }}/qemu/{{ selected_vm_id }}/status/current"
            method: GET
            headers: "{{ pve_headers }}"
            validate_certs: "{{ pve_validate_certs }}"
            status_code: 200
          register: installer_state
          until: installer_state.json.data.status == 'stopped'
          retries: 360
          delay: 10
          changed_when: false

        - name: Detach the installer ISO and boot only from the disk
          ansible.builtin.uri:
            url: "{{ pve_api }}/nodes/{{ pve_node }}/qemu/{{ selected_vm_id }}/config"
            method: PUT
            headers: "{{ pve_headers }}"
            body_format: form-urlencoded
            body:
              ide2: "none,media=cdrom"
              boot: "order=scsi0"
            validate_certs: "{{ pve_validate_certs }}"
            status_code: 200
          changed_when: true

        - name: Start the installed Debian VM
          ansible.builtin.uri:
            url: "{{ pve_api }}/nodes/{{ pve_node }}/qemu/{{ selected_vm_id }}/status/start"
            method: POST
            headers: "{{ pve_headers }}"
            validate_certs: "{{ pve_validate_certs }}"
            status_code: 200
          register: debian_start
          changed_when: true

        - name: Wait for the Debian startup task
          ansible.builtin.uri:
            url: "{{ pve_api }}/nodes/{{ pve_node }}/tasks/{{ debian_start.json.data | urlencode }}/status"
            method: GET
            headers: "{{ pve_headers }}"
            validate_certs: "{{ pve_validate_certs }}"
            status_code: 200
          register: debian_start_status
          until: debian_start_status.json.data.status == 'stopped'
          retries: 60
          delay: 2
          changed_when: false

        - name: Confirm that Proxmox started the VM
          ansible.builtin.assert:
            that:
              - debian_start_status.json.data.exitstatus == 'OK'
            fail_msg: "Proxmox could not start the installed VM; check its task log."

        - name: Show the provisioning result
          ansible.builtin.debug:
            msg: >-
              VM {{ selected_vm_id }} ({{ vm_name }}) has been started
              from its disk. The installer ISO is detached.
              Guest access and installation validation are the next checks.
